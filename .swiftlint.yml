# SwiftLint configuration for Airlyhub
# Docs: https://realm.github.io/SwiftLint/rule-directory.html
included:
  - Airlyhub
  - Core
  - Data
  - Domain
  - DesignSystems
  - Features
  - Utilities
  - Resources

excluded:
  - Derived
  - Tuist/.build
  - '**/.build'
  - AirlyhubTests
  - AirlyhubUITests
  - '**/*.generated.swift'

opt_in_rules:
  - empty_count
  - empty_string
  - closure_spacing
  - contains_over_first_not_nil
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - vertical_whitespace_closing_braces
  - redundant_nil_coalescing
  - toggle_bool
  - fatal_error_message

disabled_rules:
  - trailing_whitespace
  - todo

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 600
  error: 1000
  ignore_comment_only_lines: true

function_body_length:
  warning: 80
  error: 150

cyclomatic_complexity:
  warning: 15
  error: 25

identifier_name:
  min_length:
    warning: 2
  max_length:
    warning: 50
    error: 60
  allowed_symbols: ['_']
  excluded:
    - id
    - x
    - y
    - vm
    - vc
    - to
    - up

nesting:
  type_level:
    warning: 3

force_cast: warning
force_try: warning

reporter: 'xcode'

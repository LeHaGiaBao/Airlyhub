# SwiftLint configuration for Airlyhub
# Docs: https://realm.github.io/SwiftLint/rule-directory.html
included:
  - Sources

excluded:
  - Derived
  - Tuist/.build
  - '**/.build'
  - Tests
  - Playground
  - '**/*.generated.swift'

custom_rules:
  no_firebase_in_features:
    included: 'Sources/Features/.*\.swift'
    regex: '^import\s+Firebase\w*'
    message: "Features không được import Firebase trực tiếp — đi qua protocol trong Domain/Repositories và inject qua AppContainer."
    severity: error
  no_uikit_in_domain:
    included: 'Sources/Domain/.*\.swift'
    regex: '^import\s+UIKit'
    message: "Domain nên Foundation-only. Nếu bắt buộc cần UIKit (display model hiện có), đây là nhắc nhở để cân nhắc chuyển sang DesignSystem/Features."
    severity: warning

opt_in_rules:
  - empty_count
  - empty_string
  - closure_spacing
  - contains_over_first_not_nil
  - first_where
  - force_unwrapping
  - vertical_whitespace_closing_braces
  - redundant_nil_coalescing
  - toggle_bool
  - fatal_error_message

# implicitly_unwrapped_optional deliberately left out of opt_in_rules: every current
# violation is the VIPER `var presenter: XPresenterProtocol!` Builder-injection pattern
# (see viper-feature-convention) or a one-shot layout constraint set once in setup —
# both intentional, not oversights. Re-enable only if that convention changes.

disabled_rules:
  - trailing_whitespace
  - todo

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 600
  error: 1000
  ignore_comment_only_lines: true

function_body_length:
  warning: 80
  error: 150

cyclomatic_complexity:
  warning: 15
  error: 25

type_name:
  max_length:
    warning: 50
    error: 60

identifier_name:
  min_length:
    warning: 2
  max_length:
    warning: 50
    error: 60
  allowed_symbols: ['_']
  excluded:
    - id
    - x
    - y
    - vm
    - vc
    - to
    - up

nesting:
  type_level:
    warning: 3

force_cast: warning
force_try: warning

reporter: 'xcode'
